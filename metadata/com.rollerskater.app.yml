AutoName: RollerSkater
Summary: Fast, private, offline-first music player with Material 3 design
Description: |-
  RollerSkater is an offline-first, privacy-focused Android music player built with Jetpack Compose, Material 3, and Kotlin Coroutines/Flow.

  Features:
  * 100% offline and privacy-first: zero trackers, zero telemetry, zero crash uploaders, zero third-party ads
  * Audiophile-grade playback engine powered by AndroidX Media3 / ExoPlayer and FFmpeg native decoders (FLAC, ALAC, Opus, APE, and more)
  * Seamless gapless playback and configurable audio crossfade
  * Material 3 Expressive UI with dynamic theming and pure AMOLED black mode
  * Synchronized lyrics display (LRC, TTML)
  * Native metadata tag editor powered by TagLib
  * Private on-device listening statistics and year-in-review recap
  * Responsive home screen widgets (AndroidX Glance)
  * Atomic backup and restore for playlists, playback stats, and preferences

