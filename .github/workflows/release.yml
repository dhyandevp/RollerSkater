name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.4.1)"
        required: true

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Signing Keystore
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ] && [ -n "$CI_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > release.jks
            KEYSTORE_PASSWORD="$CI_KEYSTORE_PASSWORD"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkey -v -keystore release.jks -alias rollerskater-key -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=RollerSkater Release, OU=Mobile, O=RollerSkater, L=World, S=World, C=US"
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=rollerskater-key"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease -Prollerskater.enableAbiSplits=true

      - name: Prepare Artifacts & Checksums
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.tag.outputs.name }}"
          for abi in arm64-v8a armeabi-v7a; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            if [ -f "$src" ]; then
              dest="release-artifacts/RollerSkater-$TAG-$abi.apk"
              cp "$src" "$dest"
            fi
          done

          cd release-artifacts
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: RollerSkater ${{ steps.tag.outputs.name }}
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
