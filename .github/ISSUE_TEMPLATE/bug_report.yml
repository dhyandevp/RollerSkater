name: Bug Report
description: Create a report to help us fix an issue in RollerSkater
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise explanation of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Open '...'
        2. Tap on '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: "e.g., Google Pixel 8, Samsung Galaxy S23, Xiaomi Redmi Note 12"
    validations:
      required: true
  - type: dropdown
    id: android_version
    attributes:
      label: Android OS Version
      options:
        - "Android 15 (API 35)"
        - "Android 14 (API 34)"
        - "Android 13 (API 33)"
        - "Android 12L / 12 (API 31/32)"
        - "Android 11 (API 30)"
        - "Other / Custom ROM"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: RollerSkater Version
      placeholder: "e.g., v0.4.0 or git commit hash"
    validations:
      required: true
  - type: input
    id: audio_format
    attributes:
      label: Audio Format (if playback-related)
      placeholder: "e.g., FLAC 24-bit/96kHz, MP3 320kbps, OPUS, AAC/M4A"
    validations:
      required: false
  - type: textarea
    id: logcat
    attributes:
      label: Crash Logs or Logcat Output
      description: Paste any crash traces or logcat output below.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have verified that this issue occurs on the latest version of RollerSkater.
          required: true
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
